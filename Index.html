<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHUBHAM.COM | AI Studio</title>
<style>
:root {
  --cyan:#06b6d4;
  --blue:#2563eb;
  --ink:#243047;
  --muted:#718096;
  --cream:#fdfbf7;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#fdfbf7,#e8faff);
  color:var(--ink);min-height:100vh
}
header{
  padding:18px 6%;display:flex;align-items:center;
  justify-content:space-between;background:white;
  border-bottom:1px solid #eee
}
.brand{display:flex;align-items:center;gap:10px;font-size:23px;font-weight:800}
.logo{
  width:42px;height:42px;border-radius:13px;
  background:linear-gradient(135deg,var(--cyan),var(--blue));
  display:grid;place-items:center;color:white;font-size:25px
}
.tag{font-size:12px;color:var(--muted)}
main{max-width:950px;margin:35px auto;padding:0 16px}
.hero{text-align:center;margin-bottom:28px}
.hero h1{font-size:32px;margin-bottom:10px}
.hero p{color:var(--muted)}
.studio{
  background:white;padding:24px;border-radius:20px;
  border:1px solid #e5e7eb;box-shadow:0 10px 30px #0000000a
}
h2{font-size:20px;margin-bottom:16px}
.features{
  display:grid;grid-template-columns:repeat(5,1fr);
  gap:10px;margin-bottom:25px
}
.feature{
  background:white;border:1px solid #e5e7eb;
  border-radius:12px;padding:13px 7px;cursor:pointer;
  font-weight:bold;color:var(--ink);min-height:85px
}
.feature .ico{display:block;font-size:24px;margin-bottom:8px}
.feature.active{background:#e7faff;border-color:var(--cyan);color:#087f8c}
label{display:block;font-weight:bold;margin:16px 0 8px}
textarea,select{
  width:100%;padding:13px;border:1px solid #ddd;
  border-radius:9px;font-size:15px;background:white
}
textarea{min-height:110px;resize:vertical}
.upload{
  padding:22px;border:2px dashed #9bdce8;border-radius:12px;
  text-align:center;background:#f5fcff;color:#087f8c;cursor:pointer
}
.upload input{display:none}
#preview{
  display:none;max-width:100%;max-height:230px;
  margin:15px auto;border-radius:12px
}
.options{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.primary{
  width:100%;padding:15px;margin-top:22px;border:0;
  border-radius:11px;background:linear-gradient(100deg,var(--cyan),var(--blue));
  color:white;font-size:16px;font-weight:bold;cursor:pointer
}
#status{
  display:none;margin-top:15px;padding:13px;
  background:#f0f9ff;border-radius:9px;line-height:1.5
}
footer{text-align:center;padding:28px;color:var(--muted);font-size:13px}
@media(max-width:650px){
  .features{grid-template-columns:repeat(2,1fr)}
  .options{grid-template-columns:1fr}
  .hero h1{font-size:26px}
  .studio{padding:16px}
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="logo">S</span>
    <span>SHUBHAM<span style="color:#06b6d4">.COM</span></span>
  </div>
  <span class="tag">NEXT GENERATION AI STUDIO</span>
</header>

<main>
  <section class="hero">
    <h1>Make Every Idea a Visual</h1>
    <p>Transform your imagination into stunning creations with AI.</p>
  </section>

  <section class="studio">
    <h2>Choose Your AI Tool</h2>

    <div class="features">
      <button class="feature active" data-mode="video">
        <span class="ico">🎬</span>Text to Video
      </button>
      <button class="feature" data-mode="imagevideo">
        <span class="ico">🖼️</span>Image to Video
      </button>
      <button class="feature" data-mode="image">
        <span class="ico">🎨</span>AI Image
      </button>
      <button class="feature" data-mode="voice">
        <span class="ico">🎙️</span>AI Voice
      </button>
      <button class="feature" data-mode="enhancer">
        <span class="ico">✨</span>Prompt Enhancer
      </button>
    </div>

    <h2 id="toolTitle">Text to Video Generator</h2>

    <label for="prompt">Describe your idea</label>
    <textarea id="prompt" placeholder="Describe your dream video here..."></textarea>

    <div id="uploadArea" hidden>
      <label for="file">Upload an image</label>
      <label class="upload" for="file">
        📁 Choose an image from your device
        <input id="file" type="file" accept="image/*">
      </label>
      <img id="preview" alt="Image preview">
    </div>

    <div class="options">
      <div>
        <label for="duration">Duration</label>
        <select id="duration">
          <option value="30">30 seconds</option>
          <option value="60">1 minute</option>
          <option value="300">5 minutes</option>
        </select>
      </div>
      <div>
        <label for="ratio">Aspect Ratio</label>
        <select id="ratio">
          <option>Landscape 16:9</option>
          <option>Portrait 9:16</option>
          <option>Square 1:1</option>
        </select>
      </div>
      <div>
        <label for="style">Visual Style</label>
        <select id="style">
          <option>Cinematic</option>
          <option>Realistic</option>
          <option>Animation</option>
          <option>3D</option>
          <option>Artistic</option>
        </select>
      </div>
      <div>
        <label for="voice">Voice Language</label>
        <select id="voice">
          <option>Hindi</option>
          <option>English</option>
          <option>Marathi</option>
          <option>No Voice</option>
        </select>
      </div>
    </div>

    <button class="primary" id="generate">Generate Video</button>
    <div id="status" role="status"></div>
  </section>
</main>

<footer>© 2026 SHUBHAM.COM — AI Creative Studio</footer>

<script>
const tools = {
  video:{
    title:"Text to Video Generator",
    placeholder:"Describe the video you want to create...",
    upload:false,button:"Generate Video"
  },
  imagevideo:{
    title:"Image to Video Generator",
    placeholder:"Describe how your image should move...",
    upload:true,button:"Generate Video"
  },
  image:{
    title:"AI Image Generator",
    placeholder:"Describe the image you want to create...",
    upload:false,button:"Generate Image"
  },
  voice:{
    title:"AI Voice Generator",
    placeholder:"Type the text you want the AI voice to speak...",
    upload:false,button:"Generate Voice"
  },
  enhancer:{
    title:"AI Prompt Enhancer",
    placeholder:"Write a simple idea to improve...",
    upload:false,button:"Enhance Prompt"
  }
};

let currentMode="video";

const promptBox=document.getElementById("prompt");
const uploadArea=document.getElementById("uploadArea");
const generateButton=document.getElementById("generate");
const statusBox=document.getElementById("status");

document.querySelectorAll(".feature").forEach(button=>{
  button.addEventListener("click",()=>{
    currentMode=button.dataset.mode;

    document.querySelectorAll(".feature").forEach(item=>{
      item.classList.remove("active");
    });
    button.classList.add("active");

    const tool=tools[currentMode];
    document.getElementById("toolTitle").textContent=tool.title;
    promptBox.placeholder=tool.placeholder;
    uploadArea.hidden=!tool.upload;
    generateButton.textContent=tool.button;
    statusBox.style.display="none";
  });
});

document.getElementById("file").addEventListener("change",event=>{
  const file=event.target.files[0];
  const preview=document.getElementById("preview");

  if(!file)return;

  if(!file.type.startsWith("image/")){
    alert("Please select an image file.");
    event.target.value="";
    return;
  }

  preview.src=URL.createObjectURL(file);
  preview.style.display="block";
});

generateButton.addEventListener("click",()=>{
  const prompt=promptBox.value.trim();

  if(!prompt){
    statusBox.textContent="Please enter your prompt first.";
    statusBox.style.display="block";
    promptBox.focus();
    return;
  }

  if(currentMode==="imagevideo" &&
     !document.getElementById("file").files.length){
    statusBox.textContent="Please upload an image first.";
    statusBox.style.display="block";
    return;
  }

  if(currentMode==="enhancer"){
    promptBox.value=
      "Create a high-quality, detailed, visually engaging result: "+
      prompt+
      ". Use clear composition, professional lighting, rich details and a polished style.";

    statusBox.textContent="Your prompt has been improved. Review it above.";
  }else{
    statusBox.textContent=
      "Your request is ready. Real AI generation is not connected yet. "+
      "An authorized AI service and secure backend connection are required.";
  }

  statusBox.style.display="block";
});
</script>
</body>
</html>
